# SYSC-Greet Hyprland config for greetd greeter session
# Monitors auto-detected by Hyprland at runtime
monitor = DP-3, 2560x1440@165, 0x0, 1
monitor = HDMI-A-1, disable

# No animations for faster greeter startup
animations {
    enabled = false
}

# Minimal decorations
decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

# Greeter doesn't need gaps
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# CHANGED 2025-10-18 - Disable Hyprland wallpaper/logo for greeter
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
    # Suppress watchdog warning - greetd doesn't pass fd properly to start-hyprland
    disable_watchdog_warning = true
}

# Suppress annoying update/donation popups
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# Input configuration
input {
    kb_layout = us
    repeat_delay = 400
    repeat_rate = 40

    touchpad {
        tap-to-click = true
    }
}

# Uncomment to hide cursor completely
cursor {
    invisible = true
}

# Disable all keybindings (security for greeter)
# No binds = no user control

# Window rules for /nix/store/hikgqfi07il3ah04xbyrlm6rani5zzrc-kitty-0.46.2/bin/kitty greeter
windowrule = match:class ^(kitty)$, fullscreen on, opacity 1.0

# Layer rules for wallpaper daemon
layerrule = match:namespace wallpaper, blur on

# Startup applications
# Start gslapper with default wallpaper (forked to background with IPC socket)
exec-once = gslapper -f -I /tmp/sysc-greet-wallpaper.sock '*' /usr/share/sysc-greet/wallpapers/sysc-greet-default.png
exec-once = XDG_CACHE_HOME=/tmp/greeter-cache HOME=/var/lib/greeter /run/current-system/sw/bin/kitty --start-as=fullscreen --config=/etc/greetd/kitty.conf /run/current-system/sw/bin/sysc-greet && /run/current-system/sw/bin/hyprctl dispatch exit
